name: Upstream maintenance monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Mozilla release and Termux recipe drift
        run: python3 scripts/check_upstream.py --output .work/upstream-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: upstream-maintenance-report
          path: .work/upstream-report.json
          if-no-files-found: warn
          retention-days: 14
